<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>끈을 당겨라! 입체도형 접기</title>
<style>
  :root {
    --bg: #fdf8f0; --ink: #2d2a32; --muted: #7a7385; --card: #ffffff;
    --accent: #ff7a59; --line: #ece4d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  header { text-align: center; padding: 18px 16px 0; }
  h1 { margin: 0; font-size: clamp(22px, 5vw, 32px); }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }

  .shapes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 12px 16px; }
  .shapes button {
    border: 2px solid var(--line); background: var(--card); color: var(--ink);
    padding: 9px 16px; border-radius: 999px; font-size: 15px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: transform .1s;
  }
  .shapes button:hover { transform: translateY(-1px); }
  .shapes button.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  .viewport {
    width: min(620px, 96vw); height: clamp(260px, calc(100vh - 290px), 420px); position: relative;
    perspective: 1100px; cursor: grab; touch-action: none;
    background: radial-gradient(ellipse at center, #fff 0%, #f6eee2 75%);
    border-radius: 24px; border: 1px solid var(--line); overflow: hidden;
  }
  .viewport:active { cursor: grabbing; }
  .stage { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
  .face { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
  .face svg { position: absolute; overflow: visible; backface-visibility: visible; }
  .hint { position: absolute; bottom: 10px; width: 100%; text-align: center; font-size: 13px; color: var(--muted); pointer-events: none; }

  .controls { width: min(620px, 96vw); padding: 12px 4px 8px; display: flex; gap: 14px; align-items: center; }
  .controls input[type=range] { flex: 1; accent-color: var(--accent); height: 28px; }
  .pull {
    border: none; background: var(--accent); color: #fff; font-weight: 700; font-size: 16px;
    padding: 12px 20px; border-radius: 14px; cursor: pointer; font-family: inherit; white-space: nowrap;
    box-shadow: 0 3px 0 #d95a3b;
  }
  .pull:active { transform: translateY(2px); box-shadow: 0 1px 0 #d95a3b; }
  .label { font-size: 13px; color: var(--muted); width: 44px; text-align: right; font-variant-numeric: tabular-nums; }

  .info {
    width: min(620px, 96vw); background: var(--card); border: 1px solid var(--line);
    border-radius: 20px; padding: 18px 20px; margin: 8px 0 32px;
  }
  .info h2 { margin: 0 0 4px; font-size: 20px; }
  .info .desc { margin: 0 0 14px; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--bg); border-radius: 14px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 26px; }
  .stat span { font-size: 13px; color: var(--muted); }
  .euler { margin: 14px 0 0; font-size: 14px; color: var(--muted); text-align: center; }
  .euler strong { color: var(--ink); }
</style>
</head>
<body>
<header>
  <h1>🧶 끈을 당겨라! 입체도형 접기</h1>
  <p>평평한 전개도가 입체도형으로 변신해요</p>
</header>

<div class="shapes" id="shapes"></div>

<div class="viewport" id="viewport">
  <div class="stage" id="stage"></div>
  <div class="hint">드래그해서 돌려 보세요</div>
</div>

<div class="controls">
  <button class="pull" id="pull">끈 당기기 🧶</button>
  <input type="range" id="slider" min="0" max="1000" value="0" aria-label="접힌 정도">
  <span class="label" id="pct">0%</span>
</div>

<section class="info">
  <h2 id="name"></h2>
  <p class="desc" id="desc"></p>
  <div class="stats">
    <div class="stat"><b id="F"></b><span>면</span></div>
    <div class="stat"><b id="E"></b><span>모서리</span></div>
    <div class="stat"><b id="V"></b><span>꼭짓점</span></div>
  </div>
  <p class="euler" id="euler"></p>
</section>

<script>
// ---- 전개도 정의 ----
// 각 면은 정다각형. 트리 {모서리번호: 자식트리}. 0번 모서리는 부모와 붙는 경첩.
function icosaTree() {
  const E = k => (k === 5 ? { 1: {} } : { 1: {}, 2: D(k + 1) });
  const D = k => ({ 2: {}, 1: E(k) });
  return { 0: {}, 2: E(1) };
}
function dodecaTree(innerEdge) {
  const B = { 1: {}, 2: {}, 3: {}, 4: {} };
  const L = { [innerEdge]: B };
  return { 0: {}, 1: {}, 2: { 2: L }, 3: {}, 4: {} };
}

const SHAPES = {
  tetra: { name: '정사면체', n: 3, s: 150, fold: 180 - 70.5288, tree: { 0: {}, 1: {}, 2: {} },
    F: 4, E: 6, V: 4, desc: '정삼각형 4개로 만든 가장 단순한 입체도형이에요. 한 꼭짓점에 면이 3개씩 모여요.' },
  cube: { name: '정육면체', n: 4, s: 100, fold: 90, tree: { 0: {}, 1: {}, 2: { 2: {} }, 3: {} },
    F: 6, E: 12, V: 8, desc: '정사각형 6개로 만든 주사위 모양이에요. 한 꼭짓점에 면이 3개씩 모여요.' },
  octa: { name: '정팔면체', n: 3, s: 105, fold: 180 - 109.4712,
    tree: { 0: {}, 2: { 1: { 1: { 2: {} }, 2: {} }, 2: {} } },
    F: 8, E: 12, V: 6, desc: '정삼각형 8개로 만들어요. 피라미드 두 개를 아래로 맞붙인 모양이에요. 한 꼭짓점에 면이 4개씩 모여요.' },
  dodeca: { name: '정십이면체', n: 5, s: 58, fold: 180 - 116.5651, tree: dodecaTree(3),
    F: 12, E: 30, V: 20, desc: '정오각형 12개로 만든 공 같은 도형이에요. 한 꼭짓점에 면이 3개씩 모여요.' },
  icosa: { name: '정이십면체', n: 3, s: 68, fold: 180 - 138.1897, tree: icosaTree(),
    F: 20, E: 30, V: 12, desc: '정삼각형 20개로 만든, 가장 동그란 정다면체예요. 한 꼭짓점에 면이 5개씩 모여요.' },
};

const COLORS = ['#ff9b85', '#ffd56b', '#9be3a4', '#8cc8ff', '#c9a7ff', '#ffb3d9', '#7fe0d4', '#ffc38a'];

// ---- 상태 ----
let shape, faces = [], t = 0, rx = -25, ry = 20, anim = null;
const stage = document.getElementById('stage');
const vp = document.getElementById('viewport');
const slider = document.getElementById('slider');

function geom(n, s) {
  const a = s / (2 * Math.tan(Math.PI / n));       // 중심~변 거리
  const R = s / (2 * Math.sin(Math.PI / n));       // 중심~꼭짓점 거리
  return { a, R };
}

function buildShape(key) {
  shape = SHAPES[key];
  const { n, s } = shape;
  const { a, R } = geom(n, s);
  stage.innerHTML = '';
  faces = [];

  // 다각형 꼭짓점 (중심 (0,-a), 0번 모서리는 y=0 위)
  const pts = [];
  for (let k = 0; k < n; k++) {
    const ang = (90 + 360 * k / n + 180 / n) * Math.PI / 180;
    pts.push([R * Math.cos(ang), -a + R * Math.sin(ang)]);
  }
  const pad = 3;
  const ox = R + pad, oy = a + R + pad;
  const poly = pts.map(([x, y]) => `${(x + ox).toFixed(2)},${(y + oy).toFixed(2)}`).join(' ');

  function walk(tree, parent, edge) {
    const idx = faces.length;
    const el = document.createElement('div');
    el.className = 'face';
    const color = COLORS[idx % COLORS.length];
    el.innerHTML = `<svg width="${2 * ox}" height="${2 * oy}" style="left:${-ox}px;top:${-oy}px">
      <polygon points="${poly}" fill="${color}" stroke="#2d2a32" stroke-width="2" stroke-linejoin="round"/></svg>`;
    stage.appendChild(el);
    const f = { el, svg: el.firstElementChild, parent, edge };
    faces.push(f);
    for (const k of Object.keys(tree)) walk(tree[k], f, +k);
  }
  walk(shape.tree, null, null);
  shape.a = a;
  shape.pts = pts;
  render();
  updateInfo();
}

function faceMatrix(f, foldDeg) {
  if (f._m) return f._m;
  let m;
  if (!f.parent) {
    m = new DOMMatrix().translate(0, shape.a);
  } else {
    const p = faceMatrix(f.parent, foldDeg);
    const th = 90 + 360 * f.edge / shape.n;
    const r = th * Math.PI / 180;
    const mx = shape.a * Math.cos(r), my = -shape.a + shape.a * Math.sin(r);
    m = p.translate(mx, my).rotate(0, 0, th + 90).rotateAxisAngle(1, 0, 0, foldDeg);
  }
  f._m = m;
  return m;
}

function render() {
  const fold = shape.fold * t;
  faces.forEach(f => (f._m = null));
  // 무게중심을 회전 중심으로
  let cx = 0, cy = 0, cz = 0;
  const mats = faces.map(f => faceMatrix(f, fold));
  for (const m of mats) {
    const p = m.transformPoint(new DOMPoint(0, -shape.a, 0));
    cx += p.x; cy += p.y; cz += p.z;
  }
  const N = faces.length;
  cx /= N; cy /= N; cz /= N;

  const view = new DOMMatrix().rotateAxisAngle(1, 0, 0, rx).rotateAxisAngle(0, 1, 0, ry);
  // 화면에 꼭 맞게 크기 자동 조절
  let maxD = 0;
  for (const m of mats) for (const [x, y] of shape.pts) {
    const p = m.transformPoint(new DOMPoint(x, y, 0));
    maxD = Math.max(maxD, Math.hypot(p.x - cx, p.y - cy, p.z - cz));
  }
  const box = Math.min(vp.clientWidth, vp.clientHeight);
  const zoom = (box * 0.34) / maxD;
  const stageM = view.scale(zoom, zoom, zoom).translate(-cx, -cy, -cz);
  stage.style.transform = stageM.toString();

  mats.forEach((m, i) => {
    faces[i].el.style.transform = m.toString();
    // 간단한 명암: 화면을 향하는 정도
    const full = stageM.multiply(m);
    const nz = Math.abs(full.m33);
    faces[i].svg.style.filter = `brightness(${(0.72 + 0.32 * nz).toFixed(3)})`;
  });
  document.getElementById('pct').textContent = Math.round(t * 100) + '%';
}

function updateInfo() {
  document.getElementById('name').textContent = shape.name;
  document.getElementById('desc').textContent = shape.desc;
  document.getElementById('F').textContent = shape.F;
  document.getElementById('E').textContent = shape.E;
  document.getElementById('V').textContent = shape.V;
  document.getElementById('euler').innerHTML =
    `신기한 규칙! 꼭짓점 − 모서리 + 면 = ${shape.V} − ${shape.E} + ${shape.F} = <strong>2</strong>`;
}

// ---- 도형 버튼 ----
const shapesEl = document.getElementById('shapes');
for (const [key, s] of Object.entries(SHAPES)) {
  const b = document.createElement('button');
  b.textContent = s.name;
  b.onclick = () => {
    shapesEl.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    stopAnim(); t = 0; slider.value = 0;
    buildShape(key);
    setPullLabel();
  };
  shapesEl.appendChild(b);
}

// ---- 끈 당기기 애니메이션 ----
const pullBtn = document.getElementById('pull');
function stopAnim() { if (anim) cancelAnimationFrame(anim); anim = null; }
function setPullLabel() { pullBtn.textContent = t > 0.5 ? '다시 펼치기 📄' : '끈 당기기 🧶'; }
pullBtn.onclick = () => {
  stopAnim();
  const from = t, to = t > 0.5 ? 0 : 1, dur = 1400 * Math.abs(to - from) + 1;
  const start = performance.now();
  const ease = x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const step = now => {
    const k = Math.min(1, (now - start) / dur);
    t = from + (to - from) * ease(k);
    slider.value = t * 1000;
    render();
    if (k < 1) anim = requestAnimationFrame(step); else { anim = null; setPullLabel(); }
  };
  anim = requestAnimationFrame(step);
};
slider.oninput = () => { stopAnim(); t = slider.value / 1000; render(); setPullLabel(); };

// ---- 드래그 회전 + 자동 회전 ----
window.addEventListener('resize', () => render());
let drag = null, lastInteract = 0;
vp.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, rx, ry }; vp.setPointerCapture(e.pointerId); });
vp.addEventListener('pointermove', e => {
  if (!drag) return;
  ry = drag.ry + (e.clientX - drag.x) * 0.5;
  rx = Math.max(-89, Math.min(89, drag.rx - (e.clientY - drag.y) * 0.5));
  lastInteract = performance.now();
  render();
});
vp.addEventListener('pointerup', () => { drag = null; lastInteract = performance.now(); });

(function spin() {
  if (!drag && performance.now() - lastInteract > 2500 && t > 0.05) { ry += 0.25; render(); }
  requestAnimationFrame(spin);
})();

shapesEl.querySelector('button:nth-child(2)').click(); // 정육면체로 시작
</script>
</body>
</html>
